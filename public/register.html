<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Project — FRT Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a3a5c;
      color: white;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 32px; }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; }

    nav { display: flex; gap: 4px; }
    nav a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all .15s;
    }
    nav a:hover { color: white; background: rgba(255,255,255,.1); }
    nav a.active { color: white; background: rgba(255,255,255,.18); }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-info img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); }
    .user-info span { font-size: 13px; color: rgba(255,255,255,.85); }
    .btn-signout {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-signout:hover { background: rgba(255,255,255,.22); }

    main { max-width: 640px; margin: 48px auto; padding: 0 24px 48px; }

    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 20px; font-weight: 700; color: #1a3a5c; }
    .page-header p { font-size: 13px; color: #6b7280; margin-top: 4px; line-height: 1.5; }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .hint { font-size: 12px; color: #9ca3af; font-weight: 400; margin-left: 4px; }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #1a56db; }
    .search-input:focus + .project-list { border-color: #1a56db; }

    .project-list {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 0 0 8px 8px;
      max-height: 260px;
      overflow-y: auto;
      background: white;
    }

    .project-item {
      padding: 11px 14px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid #f3f4f6;
      transition: background .1s;
      color: #374151;
      user-select: none;
    }
    .project-item:last-child { border-bottom: none; }
    .project-item:hover { background: #f0f5ff; }
    .project-item.selected { background: #1a56db; color: white; }
    .project-item.placeholder { color: #9ca3af; cursor: default; font-style: italic; }
    .project-item.placeholder:hover { background: white; }

    .selected-info {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f0f5ff;
      border: 1px solid #c7d7fd;
      border-radius: 7px;
      font-size: 13px;
      color: #1e40af;
      display: none;
    }
    .selected-info.visible { display: block; }
    .selected-info strong { font-weight: 600; }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
    }

    .btn-primary {
      background: #1a56db;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { background: #1648c0; }

    .btn-secondary {
      background: none;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
    }
    .btn-secondary:hover { border-color: #d1d5db; color: #374151; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transform: translateY(80px);
      opacity: 0;
      transition: transform .25s, opacity .25s;
      z-index: 200;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: #065f46; }
    #toast.error { background: #991b1b; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>FRT Manager</h1>
    <nav>
      <a href="/">Connected Projects</a>
      <a href="/register" class="active">Register Project</a>
    </nav>
  </div>
  <div class="header-right">
    <div class="user-info">
      <img id="user-photo" src="" alt="" style="display:none">
      <span id="user-name"></span>
    </div>
    <form action="/auth/logout" method="POST">
      <button type="submit" class="btn-signout">Sign out</button>
    </form>
  </div>
</header>

<main>
  <div class="page-header">
    <h2>Register New Project</h2>
    <p>Select an Asana project to start tracking First Response Time. Only projects without an active webhook are listed.</p>
  </div>

  <div class="card">
    <label>Select project <span class="hint">— type to search</span></label>
    <input
      type="text"
      id="search-input"
      class="search-input"
      placeholder="Search by project name…"
      oninput="filterProjects()"
      autocomplete="off"
    >
    <div class="project-list" id="project-list">
      <div class="project-item placeholder">Loading projects…</div>
    </div>

    <div class="selected-info" id="selected-info">
      Ready to register: <strong id="selected-name"></strong>
    </div>

    <div class="form-actions">
      <button id="register-btn" class="btn-primary" disabled onclick="registerWebhook()">
        Register Webhook
      </button>
      <a href="/" class="btn-secondary">Cancel</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  let allProjects = []
  let selectedGid = null
  let selectedName = null

  async function init () {
    try {
      const me = await apiFetch('/ui/me')
      if (me.name) document.getElementById('user-name').textContent = me.name
      if (me.photo) {
        const img = document.getElementById('user-photo')
        img.src = me.photo
        img.style.display = 'block'
      }
    } catch {}
    await loadProjects()
  }

  async function loadProjects () {
    try {
      const { projects } = await apiFetch('/ui/projects')
      allProjects = projects
      renderProjects(projects)
    } catch {
      document.getElementById('project-list').innerHTML =
        '<div class="project-item placeholder">Failed to load projects — please refresh.</div>'
    }
  }

  function renderProjects (projects) {
    const list = document.getElementById('project-list')
    if (!projects.length) {
      list.innerHTML = '<div class="project-item placeholder">All projects already have webhooks registered.</div>'
      return
    }
    list.innerHTML = projects.map(p => `
      <div class="project-item" data-gid="${esc(p.gid)}" data-name="${esc(p.name)}" onclick="selectProject(this)">
        ${esc(p.name)}
      </div>
    `).join('')
  }

  function filterProjects () {
    const q = document.getElementById('search-input').value.toLowerCase()
    const filtered = allProjects.filter(p => p.name.toLowerCase().includes(q))
    renderProjects(filtered)
    clearSelection()
  }

  function selectProject (el) {
    document.querySelectorAll('.project-item').forEach(i => i.classList.remove('selected'))
    el.classList.add('selected')
    selectedGid = el.dataset.gid
    selectedName = el.dataset.name
    document.getElementById('selected-name').textContent = selectedName
    document.getElementById('selected-info').classList.add('visible')
    document.getElementById('register-btn').disabled = false
  }

  function clearSelection () {
    selectedGid = null
    selectedName = null
    document.getElementById('selected-info').classList.remove('visible')
    document.getElementById('register-btn').disabled = true
  }

  async function registerWebhook () {
    if (!selectedGid) return
    const btn = document.getElementById('register-btn')
    btn.disabled = true
    btn.textContent = 'Registering…'
    try {
      await apiFetch('/ui/webhooks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gid: selectedGid })
      })
      showToast(`Webhook registered for "${selectedName}"`, 'success')
      setTimeout(() => { window.location.href = '/' }, 1200)
    } catch (err) {
      showToast(err.message || 'Failed to register — please try again', 'error')
      btn.disabled = false
      btn.textContent = 'Register Webhook'
    }
  }

  async function apiFetch (url, opts = {}) {
    const res = await fetch(url, opts)
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.message || `Error ${res.status}`)
    }
    return res.status === 204 ? null : res.json()
  }

  function esc (str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  let toastTimer
  function showToast (msg, type = 'success') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `show ${type}`
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { t.className = '' }, 3500)
  }

  init()
</script>
</body>
</html>
