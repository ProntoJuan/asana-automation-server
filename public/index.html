<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRT Webhook Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #1a3a5c;
      color: white;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-info img {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
    }
    .user-info span { font-size: 14px; color: rgba(255,255,255,.9); }
    .btn-signout {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-signout:hover { background: rgba(255,255,255,.22); }

    /* Layout */
    main { max-width: 900px; margin: 32px auto; padding: 0 24px 48px; }

    /* Cards */
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 28px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 16px; font-weight: 600; color: #1a3a5c; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; margin-top: 4px; }

    /* Register form */
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: #1a56db; }

    .project-list {
      width: 100%;
      border: 1px solid #d1d5db;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 220px;
      overflow-y: auto;
      background: white;
    }
    .project-item {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid #f3f4f6;
      transition: background .1s;
      color: #374151;
    }
    .project-item:last-child { border-bottom: none; }
    .project-item:hover { background: #f0f5ff; }
    .project-item.selected { background: #1a56db; color: white; }
    .project-item.empty { color: #9ca3af; cursor: default; font-style: italic; }
    .project-item.empty:hover { background: white; }

    .register-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .btn-primary {
      background: #1a56db;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { background: #1648c0; }
    .btn-primary.loading { opacity: .7; }

    /* Webhooks table */
    .table-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .badge {
      background: #e8f0fe;
      color: #1a56db;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
    }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 0 12px 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: #fafafa; }
    tbody td {
      padding: 13px 12px;
      font-size: 14px;
      border-bottom: 1px solid #f3f4f6;
      color: #374151;
    }
    tbody tr:last-child td { border-bottom: none; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .status-active { background: #d1fae5; color: #065f46; }
    .status-inactive { background: #fee2e2; color: #991b1b; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .btn-delete {
      background: none;
      border: 1px solid #e5e7eb;
      color: #6b7280;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-delete:hover { border-color: #ef4444; color: #ef4444; background: #fff5f5; }

    .table-empty { text-align: center; color: #9ca3af; padding: 40px 12px; font-size: 14px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transform: translateY(80px);
      opacity: 0;
      transition: transform .25s, opacity .25s;
      z-index: 200;
      max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: #065f46; }
    #toast.error { background: #991b1b; }
  </style>
</head>
<body>

<header>
  <h1>FRT Webhook Manager</h1>
  <div class="user-info">
    <img id="user-photo" src="" alt="Profile" style="display:none">
    <span id="user-name"></span>
    <form action="/auth/logout" method="POST">
      <button type="submit" class="btn-signout">Sign out</button>
    </form>
  </div>
</header>

<main>

  <!-- Register -->
  <div class="card">
    <h2>Register New Project</h2>
    <p class="card-desc">Only projects without an active FRT webhook are shown. Select one and click Register.</p>

    <input type="text" id="search-input" class="search-input" placeholder="Search projects..." oninput="filterProjects()">
    <div class="project-list" id="project-list">
      <div class="project-item empty">Loading projects...</div>
    </div>

    <div class="register-actions">
      <button id="register-btn" class="btn-primary" disabled onclick="registerWebhook()">
        Register Webhook
      </button>
    </div>
  </div>

  <!-- Active Webhooks -->
  <div class="card">
    <div class="table-header">
      <h2>Active Webhooks</h2>
      <span class="badge" id="webhook-count"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Project</th>
          <th>Status</th>
          <th>Registered</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="webhooks-body">
        <tr><td colspan="4" class="table-empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</main>

<div id="toast"></div>

<script>
  let allProjects = []
  let selectedProjectGid = null
  let selectedProjectName = null

  // ── Init ──────────────────────────────────────────────────────────────────

  async function init () {
    try {
      const me = await apiFetch('/ui/me')
      if (me.name) document.getElementById('user-name').textContent = me.name
      if (me.photo) {
        const img = document.getElementById('user-photo')
        img.src = me.photo
        img.style.display = 'block'
      }
    } catch {}
    await Promise.all([loadWebhooks(), loadProjects()])
  }

  // ── Webhooks ──────────────────────────────────────────────────────────────

  async function loadWebhooks () {
    const tbody = document.getElementById('webhooks-body')
    try {
      const { webhooks } = await apiFetch('/ui/webhooks')
      document.getElementById('webhook-count').textContent = webhooks.length
      if (!webhooks.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="table-empty">No webhooks registered yet.</td></tr>'
        return
      }
      tbody.innerHTML = webhooks.map(w => `
        <tr>
          <td><strong>${esc(w.resourceName)}</strong></td>
          <td>
            <span class="status-badge ${w.active ? 'status-active' : 'status-inactive'}">
              <span class="status-dot"></span>
              ${w.active ? 'Active' : 'Inactive'}
            </span>
          </td>
          <td>${formatDate(w.createdAt)}</td>
          <td>
            <button class="btn-delete" onclick="deleteWebhook('${esc(w.webhookId)}', '${esc(w.resourceName)}', this)">
              Delete
            </button>
          </td>
        </tr>
      `).join('')
    } catch {
      tbody.innerHTML = '<tr><td colspan="4" class="table-empty">Failed to load webhooks.</td></tr>'
    }
  }

  async function deleteWebhook (webhookId, name, btn) {
    if (!confirm(`Delete the webhook for "${name}"?\n\nFRT will stop being tracked for this project.`)) return
    btn.disabled = true
    btn.textContent = 'Deleting...'
    try {
      await apiFetch(`/ui/webhooks/${webhookId}`, { method: 'DELETE' })
      showToast(`Webhook deleted for "${name}"`, 'success')
      await Promise.all([loadWebhooks(), loadProjects()])
    } catch {
      showToast('Failed to delete webhook', 'error')
      btn.disabled = false
      btn.textContent = 'Delete'
    }
  }

  // ── Projects ──────────────────────────────────────────────────────────────

  async function loadProjects () {
    try {
      const { projects } = await apiFetch('/ui/projects')
      allProjects = projects
      renderProjects(projects)
    } catch {
      document.getElementById('project-list').innerHTML =
        '<div class="project-item empty">Failed to load projects.</div>'
    }
  }

  function renderProjects (projects) {
    const list = document.getElementById('project-list')
    if (!projects.length) {
      list.innerHTML = '<div class="project-item empty">All projects already have webhooks registered.</div>'
      return
    }
    list.innerHTML = projects.map(p => `
      <div class="project-item" data-gid="${esc(p.gid)}" data-name="${esc(p.name)}" onclick="selectProject(this)">
        ${esc(p.name)}
      </div>
    `).join('')
  }

  function filterProjects () {
    const q = document.getElementById('search-input').value.toLowerCase()
    const filtered = allProjects.filter(p => p.name.toLowerCase().includes(q))
    renderProjects(filtered)
    selectedProjectGid = null
    selectedProjectName = null
    document.getElementById('register-btn').disabled = true
  }

  function selectProject (el) {
    document.querySelectorAll('.project-item').forEach(i => i.classList.remove('selected'))
    el.classList.add('selected')
    selectedProjectGid = el.dataset.gid
    selectedProjectName = el.dataset.name
    document.getElementById('register-btn').disabled = false
  }

  async function registerWebhook () {
    if (!selectedProjectGid) return
    const btn = document.getElementById('register-btn')
    btn.disabled = true
    btn.textContent = 'Registering...'
    try {
      await apiFetch('/ui/webhooks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gid: selectedProjectGid })
      })
      showToast(`Webhook registered for "${selectedProjectName}"`, 'success')
      selectedProjectGid = null
      selectedProjectName = null
      document.getElementById('search-input').value = ''
      await Promise.all([loadWebhooks(), loadProjects()])
    } catch (err) {
      showToast(err.message || 'Failed to register webhook', 'error')
    } finally {
      btn.textContent = 'Register Webhook'
      btn.disabled = !selectedProjectGid
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────

  async function apiFetch (url, opts = {}) {
    const res = await fetch(url, opts)
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.message || `Request failed (${res.status})`)
    }
    return res.status === 204 ? null : res.json()
  }

  function esc (str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  function formatDate (iso) {
    if (!iso) return '—'
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
  }

  let toastTimer
  function showToast (msg, type = 'success') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `show ${type}`
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { t.className = '' }, 3500)
  }

  init()
</script>
</body>
</html>
