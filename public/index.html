<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected Projects — FRT Manager</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #162447;
      color: white;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 32px; }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; }

    nav { display: flex; gap: 4px; }
    nav a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all .15s;
    }
    nav a:hover { color: white; background: rgba(255,255,255,.1); }
    nav a.active { color: white; background: rgba(255,255,255,.18); }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-info img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); }
    .user-info span { font-size: 13px; color: rgba(255,255,255,.85); }
    .btn-signout {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-signout:hover { background: rgba(255,255,255,.22); }

    /* Layout */
    main { max-width: 960px; margin: 32px auto; padding: 0 24px 48px; }

    /* Page header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-header h2 { font-size: 20px; font-weight: 700; color: #162447; }
    .page-header p { font-size: 13px; color: #6b7280; margin-top: 3px; }

    .btn-primary {
      background: #139be8;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #0e87d0; }

    /* Card */
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }

    /* Stats row */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 20px 24px;
    }
    .stat-label { font-size: 12px; color: #6b7280; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #162447; margin-top: 6px; }
    .stat-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    /* Table */
    .table-toolbar {
      padding: 16px 20px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-filter {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .search-filter:focus { border-color: #139be8; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .6px;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e7eb;
      background: #fafafa;
    }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: #fafbff; }
    tbody td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #f3f4f6; color: #374151; }
    tbody tr:last-child td { border-bottom: none; }

    .project-name { font-weight: 500; color: #111827; }
    .project-id { font-size: 11px; color: #9ca3af; margin-top: 2px; font-family: monospace; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
      background: #eef2ff;
      color: #4338ca;
    }
    .type-badge.type-urgent { background: #fff7ed; color: #9a3412; }

    .mini-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .4; }
    .mini-dot.mini-active { background: #10b981; opacity: 1; }

    .mini-x {
      all: unset;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      color: currentColor;
      opacity: .75;
      width: 15px;
      height: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0,0,0,.08);
    }
    .mini-x:hover { opacity: 1; background: rgba(0,0,0,.16); }
    .mini-x:focus-visible { outline: 2px solid #139be8; outline-offset: 1px; opacity: 1; }
    .mini-x:disabled { opacity: .3; cursor: not-allowed; }

    .table-empty {
      text-align: center;
      color: #9ca3af;
      padding: 56px 20px;
      font-size: 14px;
    }
    .table-empty strong { display: block; font-size: 16px; color: #6b7280; margin-bottom: 6px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transform: translateY(80px);
      opacity: 0;
      transition: transform .25s, opacity .25s;
      z-index: 200;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: #065f46; }
    #toast.error { background: #991b1b; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>FRT Manager</h1>
    <nav>
      <a href="/" class="active">Connected Projects</a>
      <a href="/register">Register Project</a>
    </nav>
  </div>
  <div class="header-right">
    <div class="user-info">
      <img id="user-photo" src="" alt="" style="display:none">
      <span id="user-name"></span>
    </div>
    <form action="/auth/logout" method="POST">
      <button type="submit" class="btn-signout">Sign out</button>
    </form>
  </div>
</header>

<main>
  <div class="page-header">
    <div>
      <h2>Connected Projects</h2>
      <p>Projects currently tracking First Response Time via Asana webhooks.</p>
    </div>
    <a href="/register" class="btn-primary">+ Register New Project</a>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Webhooks</div>
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-sub">registered projects</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active</div>
      <div class="stat-value" id="stat-active">—</div>
      <div class="stat-sub">receiving events</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Inactive</div>
      <div class="stat-value" id="stat-inactive">—</div>
      <div class="stat-sub">may need re-registration</div>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="table-toolbar">
      <input type="text" class="search-filter" id="search" placeholder="Search projects…" oninput="filterTable()">
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Project</th>
          <th>Registered</th>
        </tr>
      </thead>
      <tbody id="webhooks-body">
        <tr><td colspan="3" class="table-empty"><strong>Loading…</strong></td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="toast"></div>

<script>
  let allWebhooks = []

  async function init () {
    try {
      const me = await apiFetch('/ui/me')
      if (me.name) document.getElementById('user-name').textContent = me.name
      if (me.photo) {
        const img = document.getElementById('user-photo')
        img.src = me.photo
        img.style.display = 'block'
      }
    } catch {}

    // Delegated handler — robust against any character (e.g. apostrophes) in project names
    document.getElementById('webhooks-body').addEventListener('click', (e) => {
      const btn = e.target.closest('.mini-x')
      if (!btn) return
      deleteWebhook(btn.dataset.webhookId, btn.dataset.name, btn.dataset.typeLabel, btn)
    })

    await loadWebhooks()
  }

  async function loadWebhooks () {
    try {
      const { webhooks } = await apiFetch('/ui/webhooks')
      allWebhooks = webhooks
      renderWebhooks(webhooks)

      const active = webhooks.filter(w => w.active).length
      document.getElementById('stat-total').textContent = webhooks.length
      document.getElementById('stat-active').textContent = active
      document.getElementById('stat-inactive').textContent = webhooks.length - active
    } catch {
      document.getElementById('webhooks-body').innerHTML =
        '<tr><td colspan="3" class="table-empty"><strong>Failed to load</strong>Check your connection and refresh.</td></tr>'
    }
  }

  const TYPE_LABELS = {
    '/urgent-request': { label: 'Urgent Keyword', cssClass: 'type-urgent' },
    '/first-response-time': { label: 'FRT', cssClass: '' },
    '/total-interaction-count': { label: 'TIC', cssClass: '' }
  }

  function groupByProject (list) {
    const groups = new Map()
    for (const w of list) {
      if (!groups.has(w.resourceId)) {
        groups.set(w.resourceId, { resourceId: w.resourceId, resourceName: w.resourceName, webhooks: [] })
      }
      groups.get(w.resourceId).webhooks.push(w)
    }
    return [...groups.values()]
  }

  function webhookBadge (w) {
    const type = TYPE_LABELS[w.path] || { label: w.path, cssClass: '' }
    return `
      <span class="type-badge ${type.cssClass}">
        <span class="mini-dot ${w.active ? 'mini-active' : ''}" title="${w.active ? 'Active' : 'Inactive'}"></span>
        ${esc(type.label)}
        <button class="mini-x" data-webhook-id="${esc(w.webhookId)}" data-name="${esc(w.resourceName)}" data-type-label="${esc(type.label)}"
          title="Remove ${esc(type.label)} webhook" aria-label="Remove ${esc(type.label)} webhook for ${esc(w.resourceName)}">&times;</button>
      </span>`
  }

  function renderWebhooks (list) {
    const tbody = document.getElementById('webhooks-body')
    if (!list.length) {
      tbody.innerHTML = `
        <tr><td colspan="3" class="table-empty">
          <strong>No connected projects</strong>
          <a href="/register" style="color:#139be8;text-decoration:none">Register your first project →</a>
        </td></tr>`
      return
    }
    const groups = groupByProject(list)
    tbody.innerHTML = groups.map((g, i) => {
      const earliest = g.webhooks.reduce((min, w) => (!min || w.createdAt < min ? w.createdAt : min), null)
      return `
      <tr data-name="${esc(g.resourceName.toLowerCase())}">
        <td style="color:#9ca3af;font-size:13px">${i + 1}</td>
        <td>
          <div class="project-name">${esc(g.resourceName)}</div>
          <div class="badge-row">${g.webhooks.map(webhookBadge).join('')}</div>
          <div class="project-id">${g.webhooks.map(w => esc(w.webhookId)).join(' · ')}</div>
        </td>
        <td style="color:#6b7280">${formatDate(earliest)}</td>
      </tr>`
    }).join('')
  }

  function filterTable () {
    const q = document.getElementById('search').value.toLowerCase()
    const filtered = allWebhooks.filter(w => w.resourceName.toLowerCase().includes(q))
    renderWebhooks(filtered)
  }

  async function deleteWebhook (webhookId, name, typeLabel, btn) {
    if (!confirm(`Remove the ${typeLabel} webhook for:\n"${name}"?`)) return
    btn.disabled = true
    try {
      await apiFetch(`/ui/webhooks/${webhookId}`, { method: 'DELETE' })
      showToast(`${typeLabel} webhook removed for "${name}"`, 'success')
      await loadWebhooks()
    } catch {
      showToast('Failed to delete — please try again', 'error')
      btn.disabled = false
    }
  }

  async function apiFetch (url, opts = {}) {
    const res = await fetch(url, opts)
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.message || `Error ${res.status}`)
    }
    return res.status === 204 ? null : res.json()
  }

  function esc (str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  function formatDate (iso) {
    if (!iso) return '—'
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
  }

  let toastTimer
  function showToast (msg, type = 'success') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `show ${type}`
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { t.className = '' }, 3500)
  }

  init()
</script>
</body>
</html>
